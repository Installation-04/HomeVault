name: Release

# Publishing a tag such as v1.2.3 builds the multi-architecture images (amd64 + arm64) for the app
# and the updater, then creates the GitHub release. Installed copies notice the new release and
# offer the update from Settings.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: The tag matches the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Versions and changelog agree with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-version.sh "${{ github.ref_name }}"

  images:
    name: Image ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: homevault
            context: .
            suffix: ""
          - name: homevault-updater
            context: ./updater
            suffix: "-updater"
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (for the arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR image names must be lowercase, the repository name may not be.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      # amd64 for servers and NAS boxes, arm64 for Raspberry Pi and Apple silicon.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # People install without logging in to anything. If the package is private (new packages can start
      # that way) the installer and the Update button cannot download it, so say so loudly.
      - name: Is the image public?
        run: |
          ref="${{ steps.image.outputs.name }}"
          token=$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${ref#ghcr.io/}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' "https://ghcr.io/v2/${ref#ghcr.io/}/manifests/${{ steps.meta.outputs.version }}")
          echo "anonymous manifest request for $ref: HTTP $code"
          if [ "$code" != 200 ]; then
            echo "::warning title=Package is not public::$ref cannot be pulled anonymously. In GitHub: your profile or organization > Packages > ${ref##*/} > Package settings > Change visibility > Public. Until then installs and in-app updates cannot download it."
          fi

  # Installed copies offer an update as soon as a GitHub release exists, so the release is only created
  # after the images were pulled anonymously (as users do) and shown to work on both platforms.
  published:
    name: Published image works (${{ matrix.platform }})
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Pull anonymously and run
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          app="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          updater="ghcr.io/${GITHUB_REPOSITORY,,}-updater:$version"
          docker logout ghcr.io >/dev/null 2>&1 || true   # no credentials: exactly what an installer has
          docker pull --platform "${{ matrix.platform }}" "$app"
          docker pull --platform "${{ matrix.platform }}" "$updater"
          docker run -d --name hv --platform "${{ matrix.platform }}" -p 18090:4000 \
            -e APP_SECRET="$(openssl rand -hex 32)" -e DATA_KEY="$(openssl rand -hex 32)" -e SETUP_TOKEN=release-check-token \
            -e DB_PATH=./data/homevault.sqlite -e UPLOAD_DIR=./data/uploads -e BACKUP_DIR=./data/backups "$app"
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:18090/api/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:18090/api/health
          docker exec hv node -p process.arch
          test "$(docker exec hv printenv HOMEVAULT_VERSION)" = "${GITHUB_REF_NAME}"
          SETUP_TOKEN=release-check-token scripts/smoke-test.sh http://127.0.0.1:18090
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint sh "$updater" -c 'docker compose version && git --version'
      - name: Container logs
        if: always()
        run: docker logs hv || true

  release:
    name: GitHub release
    needs: [images, published]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Release notes
        run: scripts/release-notes.sh "${{ github.ref_name }}" "${{ github.repository }}" > release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: HomeVault ${{ github.ref_name }}
          body_path: release-notes.md
          make_latest: true
