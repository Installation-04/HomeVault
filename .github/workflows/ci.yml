name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Translation keys (EN/FR parity, no missing keys)
        run: npm run check:i18n
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  scripts:
    name: Shell scripts, compose and Caddy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x install.sh deploy.sh scripts/wizard.sh docker/entrypoint.sh updater/updater.sh scripts/smoke-test.sh scripts/e2e-update.sh scripts/e2e-wizard.sh scripts/release-notes.sh scripts/check-version.sh
      - name: docker-compose.yml is valid (plain, with the HTTPS profile, with the updater)
        run: |
          cp .env.example .env
          docker compose config --quiet
          DOMAIN=home.example.com docker compose --profile https --profile updater config --quiet
      - name: The install wizard asks the right questions and writes the right settings
        run: scripts/e2e-wizard.sh
      - name: Caddyfile is valid
        run: |
          docker run --rm -e DOMAIN=home.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  deploy:
    name: Docker image and deploy.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same command a user runs: builds the image, writes .env with fresh secrets,
      # starts the container and waits for it to be healthy.
      - name: ./deploy.sh install
        run: ./deploy.sh install --yes

      - name: Refuses to start with the placeholder secret
        run: |
          set +e
          out=$(docker run --rm -e APP_SECRET=change-me-to-a-long-random-string homevault:latest 2>&1)
          code=$?
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q APP_SECRET

      - name: Hardening is in effect
        run: |
          uid=$(docker top homevault -eo pid,uid,args | awk '$3 == "node" && $4 == "src/server.js" {print $2}' | head -n 1)
          echo "app uid: $uid"
          test -n "$uid" && test "$uid" != "0"
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' homevault)" = true
          docker inspect -f '{{.HostConfig.CapDrop}}' homevault | grep -q ALL
          docker inspect -f '{{.HostConfig.SecurityOpt}}' homevault | grep -q no-new-privileges
          stat -c '%a' .env | grep -qx 600
          stat -c '%a' data/homevault.sqlite | grep -qx 600

      - name: Black-box smoke test (setup, sign-in, upload, CSRF, headers)
        run: scripts/smoke-test.sh http://127.0.0.1:8080

      - name: Backup, change data, restore
        run: |
          set -e
          # The smoke test left one property with a document; take a backup of that state.
          ./deploy.sh backup
          archive=$(ls -1t backups/homevault-backup-*.tar.gz | head -n 1)
          listing=$(tar -tzf "$archive")
          grep -qx homevault.sqlite <<<"$listing"
          grep -q '^uploads/.*note\.txt' <<<"$listing"

          # Add a second admin after the backup...
          ./deploy.sh admin create-admin after-backup@example.com --name After
          ./deploy.sh admin list-users | grep -q after-backup@example.com

          # ...and restoring must bring the earlier state back.
          ./deploy.sh restore "$archive" --yes
          ./deploy.sh admin list-users | tee users.txt
          grep -q smoke@homevault.test users.txt
          if grep -q after-backup@example.com users.txt; then echo "restore kept data from after the backup"; exit 1; fi
          curl -fsS http://127.0.0.1:8080/api/health

      - name: ./deploy.sh update keeps the data
        run: |
          set -e
          ./deploy.sh update --no-git --yes
          ./deploy.sh admin list-users | grep -q smoke@homevault.test
          ls backups | grep -q pre-update

      - name: ./deploy.sh doctor and status
        run: |
          ./deploy.sh doctor
          ./deploy.sh status

      - name: Stops cleanly on SIGTERM
        run: |
          start=$(date +%s)
          docker stop -t 15 homevault
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' homevault)
          echo "exit code $code after ${elapsed}s"
          test "$code" -eq 0
          test "$elapsed" -lt 10

      - name: Starts again with the data intact
        run: |
          ./deploy.sh start
          ./deploy.sh admin list-users | grep -q smoke@homevault.test

      - name: Container logs
        if: always()
        run: docker logs homevault || true

      - name: ./deploy.sh uninstall --purge
        if: always()
        run: ./deploy.sh uninstall --purge --yes

  arm64:
    name: Runs on arm64 (Raspberry Pi)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # The web files are built natively; only the backend's native dependencies are fetched for arm64.
      - name: Build the arm64 images
        run: |
          docker buildx build --platform linux/arm64 --load -t homevault:arm64 .
          docker buildx build --platform linux/arm64 --load -t homevault-updater:arm64 ./updater

      - name: The app starts on arm64 and passes the smoke test
        run: |
          docker run -d --name hv-arm --platform linux/arm64 -p 18090:4000 \
            -e APP_SECRET="$(openssl rand -hex 32)" -e DATA_KEY="$(openssl rand -hex 32)" -e SETUP_TOKEN=arm64-setup-token \
            -e DB_PATH=./data/homevault.sqlite -e UPLOAD_DIR=./data/uploads -e BACKUP_DIR=./data/backups \
            homevault:arm64
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18090/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18090/api/health
          test "$(docker exec hv-arm node -p process.arch)" = arm64
          docker exec hv-arm node -e "new (require('better-sqlite3'))(':memory:').prepare('select 1').get()"
          SETUP_TOKEN=arm64-setup-token scripts/smoke-test.sh http://127.0.0.1:18090

      - name: The updater image runs on arm64
        run: docker run --rm --platform linux/arm64 --entrypoint sh homevault-updater:arm64 -c 'uname -m && docker compose version && git --version && jq --version'

      - name: Container logs
        if: always()
        run: docker logs hv-arm || true

  update-e2e:
    name: In-app update, end to end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # A real install from a local registry, an update through the app's API with the updater
      # helper doing the work, then an update to a release that does not start (must roll back).
      - name: scripts/e2e-update.sh
        run: scripts/e2e-update.sh

