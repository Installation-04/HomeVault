# HomeVault. Use ./deploy.sh rather than calling this directly: it generates
# the secrets in .env, builds, starts and health-checks everything.
name: homevault

services:
  homevault:
    image: ${HOMEVAULT_IMAGE:-homevault:latest}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        VERSION: ${HOMEVAULT_VERSION:-dev}
    container_name: homevault
    restart: unless-stopped
    # No `init: true`: the entrypoint execs into node, which handles SIGTERM itself and runs no
    # child processes. A separate init would run as root without CAP_KILL and fail to forward
    # the stop signal to the app (which runs as an unprivileged user).
    stop_grace_period: 15s
    env_file: .env
    ports:
      # Plain HTTP on the LAN by default. With --domain this is bound to 127.0.0.1
      # and Caddy (below) is the only thing exposed to the internet.
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:4000"
    volumes:
      # Point DATA_DIR at a NAS-backed path for durable storage of the SQLite
      # database, uploaded documents/photos, and backups.
      - ${DATA_DIR:-./data}:/app/backend/data

    # --- hardening -----------------------------------------------------------
    read_only: true # the image filesystem is immutable; only the volume and /tmp are writable
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    cap_add:
      # Only what the entrypoint needs to fix volume ownership and then drop to the
      # unprivileged "node" user. The app process itself runs with no capabilities.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${HOMEVAULT_MEMORY:-768m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: automatic HTTPS. Enabled by `./deploy.sh install --domain ...`
  # (docker compose --profile https up -d).
  caddy:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: homevault-caddy
    restart: unless-stopped
    depends_on:
      homevault:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them or Let's Encrypt rate limits bite
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: the helper behind the "Update" button in Settings. Enabled by deploy.sh when you
  # answer yes to one-click updates (docker compose --profile updater up -d). It is the only
  # service with access to the Docker socket (root-equivalent on this machine), so it is kept
  # minimal: no ports, read-only filesystem, no capabilities, and it only ever runs
  # `./deploy.sh update` when an administrator has confirmed an update in the app.
  updater:
    profiles: ["updater"]
    image: ${UPDATER_IMAGE:-homevault-updater:latest}
    build:
      context: ./updater
      args:
        VERSION: ${HOMEVAULT_VERSION:-dev}
    container_name: homevault-updater
    restart: unless-stopped
    # The host user, so files it updates in this folder stay yours; plus the group that owns the socket.
    user: "${HV_UID:-1000}:${HV_GID:-1000}"
    group_add: ["${DOCKER_GID:-999}"]
    working_dir: ${HV_DIR:-.}
    environment:
      HV_DIR: ${HV_DIR:-.}
      DOCKER_SOCKET: ${DOCKER_SOCKET:-/var/run/docker.sock}
      HOME: /tmp
    volumes:
      # The project folder is mounted at the same path as on the host: docker compose passes
      # absolute host paths to the Docker daemon, so they must match.
      - ${HV_DIR:-.}:${HV_DIR:-.}
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DATA_DIR:-./data}/.update:/updates
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy_data:
  caddy_config:
