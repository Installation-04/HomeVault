<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="color-scheme" content="light dark" />
    <!-- Applies the saved light/dark choice before the first paint (no white flash). A separate
         file because the Content-Security-Policy does not allow inline scripts. -->
    <script src="/theme-init.js"></script>
    <title>HomeVault</title>
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS "Add to Home Screen" support: Safari ignores the web manifest
         for most of this, so these tags carry the standalone/status-bar/
         icon behavior on iPhone and iPad. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeVault" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android/Chrome install affordance and theming -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
